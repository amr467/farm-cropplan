<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>CropPlan — Mafraq</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--sur:#161b22;--sur2:#1c2129;--sur3:#21262d;
  --bdr:#30363d;--bdr2:#484f58;
  --tx:#e6edf3;--tx2:#8b949e;--tx3:#6e7681;
  --ok:#3fb950;--info:#58a6ff;--warn:#d29922;--err:#f85149;
  --row:#fbbf24;--qty:#a78bfa;--band:#1f6feb;
  --r:8px;--rs:5px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;
  -webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

#topbar{height:44px;background:var(--sur);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;z-index:900}
.logo{font-weight:700;font-size:15px;color:var(--ok);letter-spacing:-.3px}
.spacer{flex:1}
.btn{height:28px;padding:0 9px;background:var(--sur2);border:1px solid var(--bdr);
  border-radius:var(--rs);color:var(--tx2);font-size:11px;cursor:pointer;
  white-space:nowrap;font-family:inherit}
.btn:hover:not(:disabled){background:var(--sur3);color:var(--tx)}
.btn:disabled{opacity:.35;cursor:default}
.btn.on{background:var(--ok);border-color:var(--ok);color:#0d1117;font-weight:600}
.btn.err{border-color:#5a2d32;color:var(--err)}
.btn:focus-visible{outline:2px solid var(--info);outline-offset:1px}

#tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--bdr);
  flex-shrink:0;z-index:800}
.tab{flex:1;height:36px;font-size:11.5px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--tx3);font-size:12px;font-family:inherit;cursor:pointer;letter-spacing:.2px}
.tab.on{color:var(--ok);border-bottom-color:var(--ok);font-weight:600}

.view{flex:1;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}

/* ---- plan ---- */
#mw{flex:1;position:relative;min-height:0}
#map{width:100%;height:100%;background:#0a0d12}
.leaflet-container{background:#0a0d12;cursor:default}
#tools{position:absolute;top:10px;left:10px;z-index:500;display:flex;
  flex-direction:column;gap:5px}
#tools .btn{height:34px;width:34px;padding:0;font-size:15px;display:flex;
  align-items:center;justify-content:center}
#snapring{position:absolute;width:20px;height:20px;border:2px solid var(--ok);
  border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  display:none;z-index:520}
.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  background:rgba(22,27,34,.94);border:1px solid var(--bdr);border-radius:var(--rs);
  padding:6px 11px;font-size:11px;color:var(--tx2);z-index:500;pointer-events:none;
  white-space:nowrap}

#sheet{background:var(--sur);border-top:1px solid var(--bdr);flex-shrink:0;
  max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#grip{height:20px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-bottom:1px solid var(--bdr);position:sticky;top:0;
  background:var(--sur);z-index:5}
#grip span{width:34px;height:3px;background:var(--bdr2);border-radius:2px}
#sheet.min .body{display:none}
.body{padding:10px 12px 18px}

/* ---- shared ---- */
.sec{margin-bottom:14px}
.sec-h{font-size:10px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--tx3);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.sec-h::after{content:'';flex:1;height:1px;background:var(--bdr)}
.sec-h .ar{text-transform:none;letter-spacing:0;color:var(--tx3)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:7px}
label{font-size:11px;color:var(--tx2);flex:1;min-width:0}
label .ar{color:var(--tx3);font-size:10px}
input,select{height:30px;background:var(--sur2);border:1px solid var(--bdr);
  border-radius:var(--rs);color:var(--tx);padding:0 8px;font-size:12px;
  font-family:inherit;width:94px;flex-shrink:0}
input:focus,select:focus{outline:none;border-color:var(--ok)}
input.blank{border-color:var(--warn);background:#1f1a0d}
select{width:100%}
.wide{width:100%}
.out{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);
  padding:10px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;align-items:baseline;
  padding:4px 0;border-bottom:1px solid rgba(48,54,61,.5);gap:10px}
.kv:last-child{border-bottom:none}
.kv .k{font-size:11px;color:var(--tx2)}
.kv .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.kv .v.big{font-size:18px;color:var(--ok)}
.kv .v.na{color:var(--warn);font-size:12px;font-weight:500}
.u{font-size:11px;color:var(--tx3);font-weight:400}
.note{font-size:10px;line-height:1.5;color:var(--tx3);margin-top:6px}
.note b{color:var(--warn);font-weight:600}
.gap{background:#1f1a0d;border:1px solid #5a4a1a;border-radius:var(--rs);
  padding:8px;font-size:10px;line-height:1.5;color:var(--warn);margin-top:6px}
.zlist{display:flex;flex-wrap:wrap;gap:6px}
.zchip{padding:5px 9px;background:var(--sur2);border:1px solid var(--bdr);
  border-radius:14px;font-size:11px;cursor:pointer;color:var(--tx2)}
.zchip.on{border-color:var(--ok);color:var(--ok);background:#0d2c1a}

/* ---- analysis ---- */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);
  padding:11px;margin-bottom:12px}
.card h3{font-size:12px;font-weight:600;margin-bottom:2px}
.card .why{font-size:10px;color:var(--tx3);line-height:1.5;margin-bottom:9px}
.chart{width:100%;display:block;touch-action:pan-y}
.chart text{font-size:9px;fill:var(--tx3);font-family:inherit}
.ax{stroke:var(--bdr);stroke-width:1}
.grid{stroke:var(--bdr);stroke-width:.5;opacity:.45}
.rng{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.rng .btn{height:24px;padding:0 8px;font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--tx2);
  margin-top:7px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:4px;vertical-align:-1px}
.drop{border:1px dashed var(--bdr2);border-radius:var(--r);padding:18px 12px;
  text-align:center;font-size:11px;color:var(--tx3);line-height:1.6}
.drop b{color:var(--tx2);display:block;margin-bottom:4px;font-size:12px}
.tip{position:fixed;background:rgba(22,27,34,.97);border:1px solid var(--bdr);
  border-radius:var(--rs);padding:6px 9px;font-size:11px;pointer-events:none;
  z-index:1000;display:none;white-space:nowrap}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo">CropPlan</div>
    <div class="spacer"></div>
    <button class="btn" id="b-undo" onclick="undo()" title="Undo">↶</button>
    <button class="btn" id="b-redo" onclick="redo()" title="Redo">↷</button>
    <button class="btn err" onclick="deleteZone()" title="Delete plot">🗑</button>
    <button class="btn" onclick="exportJSON()">Save</button>
    <button class="btn" onclick="document.getElementById('imp').click()">Load</button>
    <input type="file" id="imp" accept=".json" class="hidden" onchange="importJSON(event)">
  </div>

  <div id="tabs">
    <button class="tab on" id="tb-plan"    onclick="setView('plan')">Plan</button>
    <button class="tab"    id="tb-prices"  onclick="setView('prices')">Prices</button>
    <button class="tab"    id="tb-weather" onclick="setView('weather')">Weather</button>
    <button class="tab"    id="tb-table"   onclick="setView('table')">Data</button>
    <button class="tab"    id="tb-money"   onclick="setView('money')">Money</button>
  </div>

  <div class="view on" id="v-plan">
    <div id="mw">
      <div id="map"></div>
      <div id="tools">
        <button class="btn" id="t-draw" onclick="setTool('draw')" title="Draw plot">⬡</button>
        <button class="btn on" id="t-sel" onclick="setTool('select')" title="Select">↖</button>
      </div>
      <div id="snapring"></div>
      <div class="hint hidden" id="hint"></div>
    </div>
    <div id="sheet">
      <div id="grip" onclick="document.getElementById('sheet').classList.toggle('min')"><span></span></div>
      <div class="body" id="panel"></div>
    </div>
  </div>

  <div class="view" id="v-prices"><div class="scroll" id="pricesBody"></div></div>
  <div class="view" id="v-weather"><div class="scroll" id="weatherBody"></div></div>
  <div class="view" id="v-table"><div class="scroll" id="tableBody"></div></div>
  <div class="view" id="v-money"><div class="scroll" id="moneyBody"></div></div>
</div>
<div class="tip" id="tip"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   REFERENCE DATA
   Kc and stage lengths: FAO Irrigation and Drainage Paper 56,
   Allen et al. 1998, Tables 11 and 12.
   Monthly ET0: this farm's own figures, from ERA5 reanalysis at
   32.5N 36.2E, 680 m, 1995-2025, via Open-Meteo. Not a textbook mean.
   ============================================================ */
const ET0 = [55.3,65.8,106.5,146.9,194.7,211.8,224.0,203.9,161.4,122.9,80.9,57.9];
const DIM = [31,28.25,31,30,31,30,31,31,30,31,30,31];
const MONTH = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const CROPS = [
 {id:'eggplant',en:'Eggplant',ar:'باذنجان',kc:[0.6,1.05,0.90],stages:[30,45,40,25],
  plant:[5,15],src:'FAO-56 T11 May/June Mediterranean; T12 Solanaceae'},
 {id:'sweet_pepper',en:'Sweet pepper',ar:'فلفل حلو',kc:[0.6,1.05,0.90],stages:[25,35,40,20],
  plant:[4,15],src:'FAO-56 T11 Apr/June Europe & Mediterranean'},
 {id:'cauliflower',en:'Cauliflower',ar:'قرنبيط / زهرة',kc:[0.7,1.05,0.95],stages:[35,50,40,15],
  plant:[9,15],src:'FAO-56 T11 September California Desert'},
 {id:'broccoli',en:'Broccoli',ar:'بروكلي',kc:[0.7,1.05,0.95],stages:[35,45,40,15],
  plant:[9,15],src:'FAO-56 T11 September California Desert'},
 {id:'watermelon',en:'Watermelon',ar:'بطيخ',kc:[0.4,1.00,0.75],stages:[10,20,20,30],
  plant:[3,15],src:'FAO-56 T11 Mar/Aug Near East desert'},
 {id:'melon',en:'Sweet melon',ar:'شمام',kc:[0.5,1.05,0.75],stages:[25,35,40,20],
  plant:[5,15],src:'FAO-56 T11 May Mediterranean'},
 {id:'squash',en:'Squash / courgette',ar:'كوسا',kc:[0.5,0.95,0.75],stages:[25,35,25,15],
  plant:[4,15],src:'FAO-56 T11 April Mediterranean'},
 {id:'green_onion',en:'Green onion',ar:'بصل أخضر',kc:[0.7,1.00,1.00],stages:[20,45,20,10],
  plant:[10,15],src:'FAO-56 T11 October Arid Region'},
 {id:'sweet_corn',en:'Sweet corn',ar:'ذرة سكرية',kc:[0.3,1.15,1.05],stages:[20,25,25,10],
  plant:[5,15],src:'FAO-56 T11 May/June Mediterranean'},
 {id:'hot_pepper',en:'Hot pepper',ar:'فلفل حار',gap:
  'FAO-56 lists no Kc or stage lengths for hot pepper. Sweet pepper values would be a proxy, which is your call, not a sourced fact.'},
 {id:'garlic',en:'Garlic',ar:'ثوم',gap:
  'FAO-56 Table 12 gives Kc for garlic but Table 11 gives no stage lengths, so the season cannot be built.'},
 {id:'okra',en:'Okra',ar:'بامية',gap:
  'Okra is absent from FAO-56 entirely, in every crop group. There is not even a group default to fall back on.'},
];

/* ============================================================ STATE */
let zones=[], selId=null, tool='select', nextId=1;
let drawPts=[], ghost=null, nearFirst=false;
let hist=[], redoStack=[];
const FARM=[32.495,36.168];

const snap_=()=>JSON.stringify({zones,nextId});
function push(){ hist.push(snap_()); if(hist.length>60)hist.shift(); redoStack=[]; upDo(); }
function undo(){ if(!hist.length)return; redoStack.push(snap_()); apply(hist.pop()); }
function redo(){ if(!redoStack.length)return; hist.push(snap_()); apply(redoStack.pop()); }
function apply(s){ const d=JSON.parse(s); zones=d.zones; nextId=d.nextId;
  if(!zones.find(z=>z.id===selId)) selId=zones.length?zones[0].id:null; upDo(); render(); }
function upDo(){ document.getElementById('b-undo').disabled=!hist.length;
  document.getElementById('b-redo').disabled=!redoStack.length; }

/* ============================================================ MAP */
const map=L.map('map',{center:FARM,zoom:16,zoomControl:false,attributionControl:false,
  doubleClickZoom:false});
L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:21}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
const gZones=L.layerGroup().addTo(map), gDraft=L.layerGroup().addTo(map);

function px(ll){ return map.latLngToContainerPoint(L.latLng(ll[0],ll[1])); }
function pixDist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

map.on('mousemove',e=>{
  if(tool!=='draw'||!drawPts.length) return;
  ghost=[e.latlng.lat,e.latlng.lng];
  nearFirst = drawPts.length>=3 && pixDist(px(ghost),px(drawPts[0]))<18;
  drawGhost();
});
map.on('mouseout',()=>{ ghost=null; drawGhost(); });

map.on('click',e=>{
  if(tool!=='draw'){
    if(!e.originalEvent.__zone){ selId=null; render(); }
    return;
  }
  const p=[e.latlng.lat,e.latlng.lng];
  if(drawPts.length>=3 && pixDist(px(p),px(drawPts[0]))<18){ finishDraw(); return; }
  drawPts.push(p); ghost=p; drawGhost();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(drawPts.length){ cancelDraw(); } }
  else if(e.key==='Enter'&&drawPts.length>=3){ finishDraw(); }
  else if((e.ctrlKey||e.metaKey)&&e.key==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
  else if(e.key==='Backspace'&&drawPts.length){ e.preventDefault(); drawPts.pop(); drawGhost(); }
});

function drawGhost(){
  gDraft.clearLayers();
  const ring=document.getElementById('snapring');
  ring.style.display='none';
  if(!drawPts.length){ setHint(tool==='draw'?'Tap the map to place the first corner':null); return; }

  const end = nearFirst ? drawPts[0] : ghost;
  const line = end ? [...drawPts,end] : drawPts;
  if(line.length>=2)
    L.polyline(line,{color:'#58a6ff',weight:2,dashArray:'6,5',interactive:false}).addTo(gDraft);
  if(drawPts.length>=2 && end)
    L.polygon([...drawPts,end],{color:'transparent',fillColor:'#58a6ff',
      fillOpacity:.10,interactive:false}).addTo(gDraft);

  drawPts.forEach((p,i)=>{
    L.circleMarker(p,{radius:i===0?6:4.5,color:i===0?'#3fb950':'#58a6ff',
      fillColor:'#0d1117',fillOpacity:1,weight:2,interactive:false}).addTo(gDraft);
  });

  if(nearFirst){
    const q=px(drawPts[0]), r=map.getContainer().getBoundingClientRect(),
          m=document.getElementById('mw').getBoundingClientRect();
    ring.style.left=(q.x)+'px'; ring.style.top=(q.y)+'px'; ring.style.display='block';
  }
  setHint(drawPts.length<3
    ? `${drawPts.length} corner${drawPts.length===1?'':'s'} — 3 needed`
    : (nearFirst?'Click to close the plot':'Click the first corner to close, or Enter'));
}
function cancelDraw(){ drawPts=[]; ghost=null; nearFirst=false; gDraft.clearLayers(); setHint('Tap the map to place the first corner'); }
function finishDraw(){
  push();
  const z={id:nextId++,label:'Plot '+nextId,poly:drawPts.slice(),bearing:0,
           rowSpacing:1.5,plantSpacing:0.5,crop:'eggplant',yieldPerDunum:null};
  zones.push(z); selId=z.id;
  drawPts=[]; ghost=null; nearFirst=false; gDraft.clearLayers();
  setTool('select'); render();
}

/* ============================================================ GEOMETRY
   Local metric frame, equirectangular about the polygon centroid.
   Sub-metre across a plot this size.                                     */
function frame(poly){
  const lat0=poly.reduce((a,p)=>a+p[0],0)/poly.length;
  const lng0=poly.reduce((a,p)=>a+p[1],0)/poly.length;
  const kx=Math.cos(lat0*Math.PI/180)*111320, ky=110540;
  return {to:p=>({x:(p[1]-lng0)*kx,y:(p[0]-lat0)*ky}),
          from:q=>[q.y/ky+lat0,q.x/kx+lng0]};
}
function areaM2(poly){
  const f=frame(poly),pts=poly.map(f.to); let s=0;
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length]; s+=a.x*b.y-b.x*a.y;}
  return Math.abs(s)/2;
}
/* Rows are real lines clipped to the polygon, not area/spacing. That is why
   the bearing changes the count: it changes where rows meet the boundary. */
function layout(z){
  const f=frame(z.poly),pts=z.poly.map(f.to);
  const rad=z.bearing*Math.PI/180;
  const ux=Math.sin(rad),uy=Math.cos(rad), vx=Math.cos(rad),vy=-Math.sin(rad);
  let vmin=Infinity,vmax=-Infinity;
  pts.forEach(p=>{const s=p.x*vx+p.y*vy; if(s<vmin)vmin=s; if(s>vmax)vmax=s;});
  if((vmax-vmin)/z.rowSpacing>3000) return {plants:0,rowMetres:0,rows:[],overflow:true};
  const rows=[]; let plants=0,rowMetres=0;
  for(let s=vmin+z.rowSpacing/2;s<=vmax;s+=z.rowSpacing){
    const hits=[];
    for(let i=0;i<pts.length;i++){
      const a=pts[i],b=pts[(i+1)%pts.length];
      const sa=a.x*vx+a.y*vy, sb=b.x*vx+b.y*vy;
      if((sa<=s&&sb>s)||(sb<=s&&sa>s)){
        const t=(s-sa)/(sb-sa);
        hits.push((a.x+t*(b.x-a.x))*ux+(a.y+t*(b.y-a.y))*uy);
      }
    }
    hits.sort((p,q)=>p-q);
    for(let i=0;i+1<hits.length;i+=2){
      const L=hits[i+1]-hits[i]; if(L<=0)continue;
      rowMetres+=L; plants+=Math.floor(L/z.plantSpacing)+1;
      rows.push([f.from({x:hits[i]*ux+s*vx,y:hits[i]*uy+s*vy}),
                 f.from({x:hits[i+1]*ux+s*vx,y:hits[i+1]*uy+s*vy})]);
    }
  }
  return {plants,rowMetres,rows,overflow:false};
}

/* ===================== WATER, approximate minimum =====================
   ETc over the FAO-56 stage lengths at the crop's normal planting date,
   using this farm's ET0. A FLOOR: no wetting losses, no application
   efficiency, no drainage, no rainfall credit.                          */
function waterMin(c){
  if(!c.stages) return null;
  const [Li,Ld,Lm,Ll]=c.stages, total=Li+Ld+Lm+Ll, [kI,kM,kE]=c.kc;
  let m=c.plant[0],d=c.plant[1],sum=0;
  for(let i=1;i<=total;i++){
    let kc;
    if(i<=Li) kc=kI;
    else if(i<=Li+Ld) kc=kI+(i-Li)/Ld*(kM-kI);
    else if(i<=Li+Ld+Lm) kc=kM;
    else kc=kM+(i-(Li+Ld+Lm))/Ll*(kE-kM);
    sum+=kc*ET0[m-1]/DIM[m-1];
    d++; if(d>DIM[m-1]){d=1;m=m%12+1;}
  }
  return {mm:sum,days:total,endMonth:m,endDay:Math.round(d)};
}

/* ============================================================ RENDER
   Split deliberately. Dragging a vertex or the compass redraws the map only
   and patches the few numbers that changed. Rebuilding the whole panel on
   every mousemove destroyed the element being dragged, which is what made
   the compass unusable.                                                    */
function render(){ drawMap(); panel(); }

function drawMap(){
  gZones.clearLayers();
  zones.forEach(z=>{
    const sel=z.id===selId;
    const poly=L.polygon(z.poly,{color:sel?'#4ade80':'#2f6f45',weight:sel?2.5:1.5,
      fillColor:'#4ade80',fillOpacity:sel?.08:.04}).addTo(gZones);
    poly.on('click',e=>{ e.originalEvent.__zone=1; selId=z.id; render(); });
    if(sel){
      const lay=layout(z);
      if(!lay.overflow&&lay.rows.length<=600)
        lay.rows.forEach(r=>L.polyline(r,{color:'#fbbf24',weight:1,opacity:.55,
          interactive:false}).addTo(gZones));
      z.poly.forEach((p,i)=>{
        const h=L.circleMarker(p,{radius:7,color:'#4ade80',fillColor:'#0d1117',
          fillOpacity:1,weight:2}).addTo(gZones);
        h.on('mousedown',ev=>{L.DomEvent.stop(ev.originalEvent);push();drag={z,i};map.dragging.disable();});
        h.on('dblclick',ev=>{L.DomEvent.stop(ev.originalEvent);
          if(z.poly.length>3){push();z.poly.splice(i,1);render();}});
      });
    }
  });
}

/* Patch just the numbers that a live drag changes, leaving inputs alone. */
function patchStats(z){
  const lay=layout(z), a=areaM2(z.poly)/1000;
  const set=(id,v)=>{const e=document.getElementById(id); if(e)e.textContent=v;};

function compassSVG(b){
  let t='';
  for(let a=0;a<360;a+=15){
    const r1=a%90===0?29:35, rad=(a-90)*Math.PI/180;
    t+=`<line stroke="var(--bdr2)" x1="${48+r1*Math.cos(rad)}" y1="${48+r1*Math.sin(rad)}" x2="${48+40*Math.cos(rad)}" y2="${48+40*Math.sin(rad)}"/>`;
  }
  const rad=(b-90)*Math.PI/180;
  return `<svg id="compass" viewBox="0 0 96 96" width="96" height="96" style="flex-shrink:0;touch-action:none;cursor:grab">
    <circle cx="48" cy="48" r="44" fill="var(--sur2)" stroke="var(--bdr)"/>${t}
    <text x="48" y="15" text-anchor="middle" fill="var(--tx3)" font-size="9">N</text>
    <line class="needle" stroke="var(--row)" stroke-width="3" stroke-linecap="round"
      x1="${48-38*Math.cos(rad)}" y1="${48-38*Math.sin(rad)}" x2="${48+38*Math.cos(rad)}" y2="${48+38*Math.sin(rad)}"/>
    <circle cx="${48-38*Math.cos(rad)}" cy="${48-38*Math.sin(rad)}" r="6" fill="var(--row)" opacity=".25"/>
    <circle cx="${48+38*Math.cos(rad)}" cy="${48+38*Math.sin(rad)}" r="6" fill="var(--row)" opacity=".25"/>
    <circle cx="48" cy="48" r="3.5" fill="var(--row)"/>
    <text class="bval" x="48" y="87" text-anchor="middle" fill="var(--row)" font-size="11">${b}°</text></svg>`;
}
/* Compass. Listeners are installed ONCE, not per render, and dragging updates
   the needle and the counts in place. The old version rebuilt the panel on
   every mousemove, which deleted the SVG under the cursor and leaked a new
   window listener each time. That is why it felt like it fought back.      */
let compassDrag=false;
function needleAt(deg){
  const s=document.getElementById('compass'); if(!s)return;
  const rad=(deg-90)*Math.PI/180;
  const n=s.querySelector('.needle');
  n.setAttribute('x1',48-38*Math.cos(rad)); n.setAttribute('y1',48-38*Math.sin(rad));
  n.setAttribute('x2',48+38*Math.cos(rad)); n.setAttribute('y2',48+38*Math.sin(rad));
  s.querySelector('.bval').textContent=deg+'°';
  const inp=document.getElementById('bearing-in'); if(inp)inp.value=deg;
}
function compassFrom(ev){
  const s=document.getElementById('compass'); if(!s)return;
  const r=s.getBoundingClientRect(), p=ev.touches?ev.touches[0]:ev;
  const dx=p.clientX-(r.left+r.width/2), dy=p.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)<8) return;                     // ignore the hub
  const d=Math.round(Math.atan2(dx,-dy)*180/Math.PI);
  const deg=((d%180)+180)%180;
  const z=zones.find(x=>x.id===selId); if(!z)return;
  z.bearing=deg;
  needleAt(deg);
  live(()=>{ drawMap(); patchStats(z); });
}
document.addEventListener('mousedown',e=>{
  if(e.target.closest&&e.target.closest('#compass')){
    compassDrag=true; push(); e.preventDefault(); compassFrom(e);
  }
});
document.addEventListener('touchstart',e=>{
  if(e.target.closest&&e.target.closest('#compass')){
    compassDrag=true; push(); e.preventDefault(); compassFrom(e);
  }
},{passive:false});
document.addEventListener('mousemove',e=>{ if(compassDrag){e.preventDefault();compassFrom(e);} });
document.addEventListener('touchmove',e=>{ if(compassDrag){e.preventDefault();compassFrom(e);} },{passive:false});
['mouseup','touchend','touchcancel'].forEach(ev=>

function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.length);
  const head=lines[0].split(',');
  const out=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(','); if(c.length<head.length) continue;
    const o={}; head.forEach((h,j)=>o[h]=c[j]); out.push(o);
  }
  return out;
}

}

/* ============================================================ CHART HELPERS */
const W=1000, H=260, PAD={l:44,r:12,t:10,b:24};
function scale(d0,d1,r0,r1){ const k=(r1-r0)/((d1-d0)||1); return v=>r0+(v-d0)*k; }
function niceTicks(lo,hi,n=5){
  const span=(hi-lo)||1, raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].find(s=>s*mag>=raw)*mag;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) out.push(v);
  return out;
}
function axes(x,y,yl,yh,xt,yfmt=v=>fmt(v)){
  let s=`<line class="ax" x1="${PAD.l}" y1="${H-PAD.b}" x2="${W-PAD.r}" y2="${H-PAD.b}"/>`;
  niceTicks(yl,yh).forEach(v=>{
    s+=`<line class="grid" x1="${PAD.l}" y1="${y(v)}" x2="${W-PAD.r}" y2="${y(v)}"/>
        <text x="${PAD.l-6}" y="${y(v)+3}" text-anchor="end">${yfmt(v)}</text>`;
  });
  xt.forEach(t=>{ s+=`<text x="${x(t.v)}" y="${H-PAD.b+14}" text-anchor="middle">${t.l}</text>`; });
  return s;
}
/* Charts are inert SVG plus one capture rect. Hovering finds the nearest
   point by x and draws a crosshair; dragging on a time chart selects a range
   to zoom into. Registry keeps the data alongside its scales so the handler
   does not have to re-derive them.                                        */
const CHARTS={};
let chartSeq=0;
function svg(inner,opts){
  const id='c'+(++chartSeq);
  if(opts) CHARTS[id]=opts;
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${inner}<g class="hov"></g>
    <rect class="cap" x="${PAD.l}" y="${PAD.t}" width="${W-PAD.l-PAD.r}"
      height="${H-PAD.b-PAD.t}" fill="transparent" style="cursor:crosshair"/></svg>`;
}
function svgX(ev,el){
  const r=el.getBoundingClientRect();
  const p=ev.touches?ev.touches[0]:ev;
  return ((p.clientX-r.left)/r.width)*W;
}
let brush=null;
document.addEventListener('mousemove',ev=>{
  const el=ev.target.closest&&ev.target.closest('svg.chart');
  const tip=document.getElementById('tip');
  if(!el||!CHARTS[el.id]){ if(!brush){tip.style.display='none';} return; }
  const cfg=CHARTS[el.id], sx=svgX(ev,el);
  const hov=el.querySelector('.hov');

  if(brush&&brush.id===el.id){
    const a=Math.min(brush.x0,sx), b=Math.max(brush.x0,sx);
    hov.innerHTML=`<rect x="${a}" y="${PAD.t}" width="${b-a}" height="${H-PAD.b-PAD.t}"
      fill="#58a6ff" opacity=".18"/>`;
    return;
  }
  let best=null,bd=1e9;
  cfg.pts.forEach(p=>{ const d=Math.abs(cfg.x(p.k)-sx); if(d<bd){bd=d;best=p;} });
  if(!best){ tip.style.display='none'; return; }
  const px=cfg.x(best.k);
  hov.innerHTML=`<line x1="${px}" y1="${PAD.t}" x2="${px}" y2="${H-PAD.b}"
      stroke="#8b949e" stroke-width="1" stroke-dasharray="3,3"/>
    ${best.v!=null?`<circle cx="${px}" cy="${cfg.y(best.v)}" r="4" fill="#3fb950"
      stroke="#0d1117" stroke-width="1.5"/>`:''}`;
  tip.innerHTML=cfg.label(best);
  tip.style.display='block';
  const p=ev.touches?ev.touches[0]:ev;
  tip.style.left=Math.min(window.innerWidth-tip.offsetWidth-8,p.clientX+12)+'px';
  tip.style.top=(p.clientY-tip.offsetHeight-10)+'px';
});
document.addEventListener('mouseleave',()=>{document.getElementById('tip').style.display='none';});
document.addEventListener('mousedown',ev=>{
  const el=ev.target.closest&&ev.target.closest('svg.chart');
  if(!el||!CHARTS[el.id]||!CHARTS[el.id].zoom)return;
  brush={id:el.id,x0:svgX(ev,el)};
});
document.addEventListener('mouseup',ev=>{
  if(!brush)return;
  const el=document.getElementById(brush.id);
  const b=brush; brush=null;
  if(!el){return;}
  el.querySelector('.hov').innerHTML='';
  const x1=svgX(ev,el);
  if(Math.abs(x1-b.x0)<12) return;                 // a click, not a drag
  const cfg=CHARTS[b.id];
  const inv=k=>{ let lo=cfg.pts[0].k,hi=cfg.pts[cfg.pts.length-1].k;
    return lo+(k-PAD.l)/(W-PAD.l-PAD.r)*(hi-lo); };
  cfg.zoom(inv(Math.min(b.x0,x1)),inv(Math.max(b.x0,x1)));
});
function median(a){ if(!a.length)return null; const s=[...a].sort((p,q)=>p-q);
  const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function quantile(a,q){ if(!a.length)return null; const s=[...a].sort((p,q2)=>p-q2);
  const i=(s.length-1)*q, lo=Math.floor(i); return s[lo]+(s[Math.min(lo+1,s.length-1)]-s[lo])*(i-lo); }
/* ============================================================ DATA LOADING
   The app fetches data/ when served over HTTP. Opened from disk, fetch is
   blocked, so the file pickers stay as a fallback.                        */
const DAY=864e5, WEEK=7*DAY;
/* Weeks run Saturday to Friday, matching the Jordanian working week. Epoch day
   0 was a Thursday, so aggregate.py adds WEEK_OFFSET before dividing by 7;
   undo it here to recover the Saturday a bucket begins on. Labels always name
   the week that STARTS on that date, never one already gone. */
let WEEK_OFFSET=5;
function weekStart(key){ return new Date((key*7-WEEK_OFFSET)*DAY); }
function weekLabel(key){
  const a=weekStart(key), b=new Date(a.getTime()+6*DAY);
  const f=d=>d.getUTCDate()+' '+MONTH[d.getUTCMonth()];
  return f(a)+'\u2013'+f(b)+' '+b.getUTCFullYear();
}
/* Week-of-year buckets are calendar positions, not dates, so name them by the
   span they cover in a reference year: 'wk 34' alone means nothing. */
function woyLabel(woy){
  const a=new Date(Date.UTC(2001,0,1+woy*7)), b=new Date(a.getTime()+6*DAY);
  const f=d=>d.getUTCDate()+' '+MONTH[d.getUTCMonth()];
  return 'wk '+(woy+1)+' \u00b7 '+f(a)+'\u2013'+f(b);
}
function priceUnit(){ return settings.unitsPerJD==1000?'fils':'piastres'; }
function isoDay(d){ return new Date(d).toISOString().slice(0,10); }
async function getJSON(path){
  const r=await fetch(path,{cache:'no-cache'});
  if(!r.ok) throw new Error(path+' '+r.status);
  return r.json();
}
function staleBanner(meta){
  if(!meta||!meta.generated) return '';
  const age=Math.floor((Date.now()-Date.parse(meta.generated))/DAY);
  if(age<3) return '';
  return `<div class="gap"><b>Data is ${age} days old.</b> The daily job may
    have stopped. Last built ${meta.generated.slice(0,10)}.</div>`;
}

/* ============================================================ PRICES TAB */
let PIDX=null, PMETA=null, PSER=null, priceId=null, priceYears=5, priceZoom=null;
let LATEST=null, latestAll=false, latestSort='qty_t';
/* Which of the three published prices drives the charts and statistics. The
   bulletin gives a high, a low and a mode; the mode is where most of the
   volume cleared, so it is the default, but the low is what you should plan
   against if your grade is ordinary and the high if it is not. */
let priceBasis='mode';
const BASES={low:{i:2,label:'Low',ar:'الأدنى'},
             mode:{i:1,label:'Mode',ar:'الأغلب'},
             high:{i:3,label:'High',ar:'الأعلى'}};
const SEAS_BASIS={low:1,mode:3,high:5};   // p10 / median / p90 columns
function basisLabel(){ return BASES[priceBasis].label; }
function setBasis(b){ priceBasis=b; SEASONAL_CACHE_BUST=Math.random(); renderPrices(); }
let SEASONAL_CACHE_BUST=0;

function latestFor(name){
  if(!LATEST) return null;
  return LATEST.items.filter(function(i){return i.item===name;})[0]||null;
}

/* Today's bulletin for the selected item, against its own history for this
   week of the year. A price means little without knowing whether it is high
   or low for the time of year. */
function snapshotCard(meta){
  if(!LATEST) return '';
  const s=latestFor(meta.name);
  const age=Math.round((Date.now()-Date.parse(LATEST.date))/DAY);
  if(!s) return '<div class="card"><h3>Latest bulletin</h3>'+

    '. Items rotate seasonally, so a gap is normal out of season.</div></div>';
  const shown=s[priceBasis]!=null?s[priceBasis]:s.mode;
  const vs=(s.week_median&&s.mode)?100*(s.mode-s.week_median)/s.week_median:null;
  return '<div class="card"><h3>Latest bulletin \u00b7 '+LATEST.date+'</h3>'+

function exportLatest(){

  const body=LATEST.items.map(function(i){

            i.qty_t==null?'':i.qty_t, i.prev_mode==null?'':i.prev_mode,
            i.change_pct==null?'':i.change_pct,

                      {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);

  a.click();
}

/* CSV fallback: reshape a raw clean CSV into the same structure the JSON has */
function ingestCSV(rows){
  const by=new Map();
  rows.forEach(r=>{
    if(r.usable!=='1')return;
    const m=+r.price_mode; if(!isFinite(m))return;
    if(!by.has(r.item)) by.set(r.item,[]);
    by.get(r.item).push({t:Date.parse(r.date),m,l:+r.price_low,h:+r.price_high,q:+r.quantity||0});
  });
  const series=[];
  let n=0;
  by.forEach((v,name)=>{
    if(v.length<150) return;
    v.sort((a,b)=>a.t-b.t);
    const wk=new Map(), soy=new Map();
    v.forEach(o=>{
      const w=Math.floor(o.t/WEEK);
      if(!wk.has(w))wk.set(w,{m:[],l:[],h:[],q:[]});
      const b=wk.get(w); b.m.push(o.m); b.l.push(o.l); b.h.push(o.h); if(o.q)b.q.push(o.q);
      const d=new Date(o.t), woy=Math.min(52,Math.floor((o.t-Date.UTC(d.getUTCFullYear(),0,1))/WEEK));
      if(!soy.has(woy))soy.set(woy,{m:[],q:[]});
      soy.get(woy).m.push(o.m); if(o.q)soy.get(woy).q.push(o.q);
    });
    const id='s'+(n++);
    series.push({id,name,days:v.length,
      first:new Date(v[0].t).toISOString().slice(0,10),
      last:new Date(v[v.length-1].t).toISOString().slice(0,10),
      median_price:median(v.map(o=>o.m)),mapped:false,
      _weekly:[...wk.entries()].sort((a,b)=>a[0]-b[0]).map(([w,b])=>
        [w,median(b.m),median(b.l),median(b.h),median(b.q),b.m.length]),
      _seasonal:[...soy.entries()].sort((a,b)=>a[0]-b[0])
        .filter(([,b])=>b.m.length>=4).map(([w,b])=>
        [w,quantile(b.m,.1),quantile(b.m,.25),median(b.m),quantile(b.m,.75),
         quantile(b.m,.9),median(b.q),b.m.length])});
  });
  series.sort((a,b)=>b.days-a.days);
  PIDX={series};
  priceId=series[0]?series[0].id:null;
  const s=series.find(x=>x.id===priceId);
  PSER=s?{id:s.id,name:s.name,members:[s.name],weekly:s._weekly,seasonal:s._seasonal}:null;
  const orig=renderPrices;
  window.renderPrices=async function(){
    const el=document.getElementById('pricesBody');
    const m=PIDX.series.find(x=>x.id===priceId);
    const src=PIDX.series.find(x=>x.id===priceId);
    PSER={id:src.id,name:src.name,members:[src.name],weekly:src._weekly,seasonal:src._seasonal};
    drawPrices(el,m);
  };
}

function chartWeekly(){
  const all=PSER.weekly;
  if(!all||all.length<2) return '<div class="why">Not enough data.</div>';
  const lastT=weekStart(all[all.length-1][0]).getTime();
  const rows=priceZoom
    ? all.filter(w=>weekStart(w[0]).getTime()>=priceZoom[0]&&weekStart(w[0]).getTime()<=priceZoom[1])
    : all.filter(w=>weekStart(w[0]).getTime()>=lastT-priceYears*365.25*DAY);
  if(rows.length<2) return '<div class="why">Nothing in this range.</div>';
  const bi=BASES[priceBasis].i;
  const pts=rows.map(w=>({k:weekStart(w[0]).getTime(),key:w[0],
    v:w[bi],l:w[2],h:w[3],q:w[4],n:w[5]}));
  const t0=pts[0].k, t1=pts[pts.length-1].k;
  const yh=Math.max(...pts.map(p=>p.h??p.v))*1.05;
  const x=scale(t0,t1,PAD.l,W-PAD.r), y=scale(0,yh,H-PAD.b,PAD.t);
  const band=pts.map(p=>`${x(p.k)},${y(p.h??p.v)}`).join(' ')+' '+
             pts.slice().reverse().map(p=>`${x(p.k)},${y(p.l??p.v)}`).join(' ');
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(p.k)},${y(p.v)}`).join('');
  const xt=[]; const y0=new Date(t0).getUTCFullYear(), y1=new Date(t1).getUTCFullYear();
  for(let Y=y0;Y<=y1;Y++){ const v=Date.UTC(Y,0,1);
    if(v>=t0&&v<=t1&&(y1-y0<8||Y%2===0)) xt.push({v,l:Y}); }
  return svg(axes(x,y,0,yh,xt)+
    `<polygon points="${band}" fill="#1f6feb" opacity=".22"/>
     <path d="${line}" fill="none" stroke="#3fb950" stroke-width="1.6"/>`,
    {pts,x,y,zoom:(a,b)=>{priceZoom=[a,b];renderPrices();},
     label:p=>`<b>${weekLabel(p.key)}</b><br>
       ${basisLabel().toLowerCase()} ${fmt(p.v)} · range ${fmt(p.l)}–${fmt(p.h)} ${priceUnit()}/kg<br>
       ${p.q?fmt(p.q,1)+' t/day median · ':''}<span style="color:var(--tx3)">${p.n} days</span>`});
}

function chartSeasonal(){
  const s=PSER.seasonal;
  if(!s||s.length<10) return '<div class="why">Not enough data.</div>';
  const sb=SEAS_BASIS[priceBasis];
  const pts=s.map(r=>({k:r[0],p10:r[1],p25:r[2],v:r[sb],p75:r[4],p90:r[5],q:r[6],n:r[7]}));
  const yh=Math.max(...pts.map(p=>p.p90))*1.08;
  const x=scale(0,52,PAD.l,W-PAD.r), y=scale(0,yh,H-PAD.b,PAD.t);
  const poly=(a,b)=>pts.map(p=>`${x(p.k)},${y(p[a])}`).join(' ')+' '+
                    pts.slice().reverse().map(p=>`${x(p.k)},${y(p[b])}`).join(' ');
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(p.k)},${y(p.v)}`).join('');
  return svg(axes(x,y,0,yh,MONTH.map((l,i)=>({v:i*52/12+2,l})))+
    `<polygon points="${poly('p90','p10')}" fill="#3fb950" opacity=".13"/>
     <polygon points="${poly('p75','p25')}" fill="#3fb950" opacity=".22"/>
     <path d="${line}" fill="none" stroke="#3fb950" stroke-width="1.8"/>`,
    {pts,x,y,label:p=>{
      return `<b>${woyLabel(p.k)}</b><br>
       median ${fmt(p.v)} ${priceUnit()}/kg<br>
       middle half ${fmt(p.p25)}–${fmt(p.p75)}<br>
       10–90% ${fmt(p.p10)}–${fmt(p.p90)}<br>
       <span style="color:var(--tx3)">${p.n} observations</span>`;}});
}

function chartArrivals(){
  const s=PSER.seasonal;
  if(!s) return '<div class="why">No quantity data.</div>';
  const pts=s.filter(r=>r[6]).map(r=>({k:r[0],v:r[6],n:r[7]}));
  if(pts.length<10) return '<div class="why">No quantity data.</div>';
  const yh=Math.max(...pts.map(p=>p.v))*1.12;
  const x=scale(0,52,PAD.l,W-PAD.r), y=scale(0,yh,H-PAD.b,PAD.t);
  const bw=(W-PAD.l-PAD.r)/56;
  const bars=pts.map(p=>`<rect x="${x(p.k)-bw/2}" y="${y(p.v)}" width="${bw*.85}"
    height="${H-PAD.b-y(p.v)}" fill="#a78bfa" opacity=".72"/>`).join('');
  return svg(axes(x,y,0,yh,MONTH.map((l,i)=>({v:i*52/12+2,l})))+bars,
    {pts,x,y,label:p=>`<b>${woyLabel(p.k)}</b><br>
        ${fmt(p.v,1)} tonnes/day median`});
}

function weatherFromCSV(rows){
  const daily=[], byM={}, hy={};
  rows.forEach(r=>{
    const t=Date.parse(r.date); if(!isFinite(t))return;
    const tmax=+r.temperature_2m_max, tmin=+r.temperature_2m_min;
    if(!isFinite(tmax))return;
    const m=+r.date.slice(5,7), Y=+r.date.slice(0,4);
    const rain=+r.precipitation_sum||0, et0=+r.et0_fao_evapotranspiration||0;
    const settled=r.source==='era5_archive'?1:0;
    daily.push([Math.round(t/DAY),tmax,tmin,rain,et0,settled]);
    if(settled){
      (byM[m]=byM[m]||{tmax:[],tmin:[],rain:0,et0:0,frost:0,yrs:new Set()});
      byM[m].tmax.push(tmax); byM[m].tmin.push(tmin);
      byM[m].rain+=rain; byM[m].et0+=et0; byM[m].yrs.add(Y);
      if(tmin<=0)byM[m].frost++;
      const h=m>=10?Y:Y-1; hy[h]=(hy[h]||0)+rain;
    }
  });
  const yrs=new Set(); Object.values(byM).forEach(b=>b.yrs.forEach(y=>yrs.add(y)));
  const nY=yrs.size||1;
  const monthly=[];
  for(let m=1;m<=12;m++){
    const b=byM[m]||{tmax:[0],tmin:[0],rain:0,et0:0,frost:0};
    monthly.push({month:m,
      tmax:b.tmax.reduce((a,c)=>a+c,0)/b.tmax.length,
      tmin:b.tmin.reduce((a,c)=>a+c,0)/b.tmin.length,
      rain:b.rain/nY, et0:b.et0/nY, frost_nights:b.frost/nY});
  }
  return {site:{lat:32.5,lon:36.2,elevation_m:680},
    first:rows[0].date,last:rows[rows.length-1].date,
    complete_years:[...yrs].sort(),daily,monthly,
    seasonal_rain:Object.entries(hy).map(([s,v])=>({season:+s,rain:v}))
      .sort((a,b)=>a.season-b.season).slice(1,-1),
    note:'Loaded from CSV in the browser.'};
}

/* Varieties are never merged. Eggplant trades as four listings at 20, 40, 40
   and 50, and a median across them describes no crop anyone grows. The
   mapping tags each listing with a crop; you pick which one to plan against. */
function cropLabel(id){
  const c=CROPS.filter(function(x){return x.id===id;})[0];
  return c?c.en+' \u00b7 '+c.ar:id;
}
function cropGroups(mapped){
  if(!mapped.length) return '';
  const by={};
  mapped.forEach(function(s){ (by[s.crop]=by[s.crop]||[]).push(s); });
  return Object.keys(by).sort().map(function(cid){
    const list=by[cid].sort(function(a,b){return b.days-a.days;});
    return '<optgroup label="'+cropLabel(cid)+'">'+list.map(function(s){
      return '<option value="'+s.id+'"'+(s.id===priceId?' selected':'')+'>'+
        s.name+' \u00b7 '+s.days+'d \u00b7 '+fmt(s.median_price)+'</option>';
    }).join('')+'</optgroup>';
  }).join('');
}
function varietiesOf(cropId){
  if(!PIDX) return [];
  return PIDX.series.filter(function(s){return s.crop===cropId;})
    .sort(function(a,b){return b.days-a.days;});
}

function varietyCard(){
  if(!PIDX) return '';
  const rows=CROPS.filter(function(c){return !c.gap;}).map(function(c){
    const vs=varietiesOf(c.id);
    if(!vs.length) return '<div class="row"><label>'+c.en+'</label>'+
      '<span class="u" style="width:150px">no series</span></div>';
    if(vs.length===1) return '<div class="row"><label>'+c.en+'</label>'+
      '<span class="u" style="width:150px;text-align:right">'+vs[0].name+'</span></div>';
    return '<div class="row"><label>'+c.en+'</label>'+
      '<select style="width:170px" onchange="setVariety(\''+c.id+'\',this.value)">'+
      vs.map(function(s){
        return '<option value="'+s.id+'"'+(settings.priceMap[c.id]===s.id?' selected':'')+'>'+
          s.name+' \u00b7 '+fmt(s.median_price)+'</option>';
      }).join('')+'</select></div>';
  }).join('');
  return '<div class="card"><h3>Which variety</h3><div class="why">Varieties of '+
    'the same crop trade at different levels: eggplant runs from 20 to 50, '+
    'sweet pepper from 40 to 80. The ranking uses whichever you pick here, so '+

/* ============================================================ DAILY TABLE
   The weekly JSON the charts use holds medians only. Daily rows live in
   data/observations/YYYY-MM.csv.gz, which the app does not normally touch
   because loading eleven years of them would defeat the point of aggregating.
   Here we fetch just the months asked for and gunzip them in the browser,
   using DecompressionStream where available.

   Everything shown is a raw observation, not a median, so the typos the
   cleaner catches are visible here. That is deliberate: this view exists to
   let you check the data rather than to present a tidied version of it.     */

let TBL={rows:null, month:null, loading:false, tried:false,
         item:'', sort:'date', desc:true};

function monthOptions(){
  if(!PIDX) return [];
  const last=PIDX.series.reduce(function(a,s){return s.last>a?s.last:a;},'0000-00');
  const first=PIDX.series.reduce(function(a,s){return s.first<a?s.first:a;},'9999-99');
  const out=[]; let y=+last.slice(0,4), m=+last.slice(5,7);
  const y0=+first.slice(0,4), m0=+first.slice(5,7);
  while(y>y0||(y===y0&&m>=m0)){
    out.push(String(y)+'-'+String(m).padStart(2,'0'));
    m--; if(m===0){m=12;y--;}
    if(out.length>200) break;
  }
  return out;
}

async function gunzip(buf){
  if(typeof DecompressionStream==='function'){
    const s=new Response(buf).body.pipeThrough(new DecompressionStream('gzip'));
    return new Response(s).text();
  }
  throw new Error('This browser cannot decompress .gz. Use the CSV export '+
                  'from a desktop browser instead.');
}

async function loadMonth(month){
  TBL.loading=true; TBL.month=month; renderTable();
  try{
    const r=await fetch('data/observations/'+month+'.csv.gz',{cache:'no-cache'});
    if(!r.ok) throw new Error('no data file for '+month);
    const text=await gunzip(await r.arrayBuffer());
    const rows=parseCSV(text);
    TBL.rows=rows.map(function(o){
      const lo=+o.price_low, md=+o.price_mode, hi=+o.price_high;
      return {date:o.date, item:o.item, unit:o.unit,
              low:isFinite(lo)?lo:null, mode:isFinite(md)?md:null,
              high:isFinite(hi)?hi:null, qty:+o.quantity||null,
              ok:(isFinite(lo)&&isFinite(md)&&isFinite(hi)&&lo<=md&&md<=hi)};
    });
    TBL.month=month; TBL.err=null;
  }catch(e){ TBL.rows=null; TBL.err=e.message+
    '. If this says 404, the build has not copied data/observations yet.'; }
  TBL.loading=false; renderTable();
}

/* Names present in the loaded month, commonest first, so the filter offers
   real options rather than making you remember the Arabic. */
function itemNames(){
  if(!TBL.rows) return [];
  const c={};
  TBL.rows.forEach(function(r){ c[r.item]=(c[r.item]||0)+1; });
  return Object.keys(c).map(function(k){return {name:k,n:c[k]};})
    .sort(function(a,b){return b.n-a.n;});
}

function tableRows(){
  if(!TBL.rows) return [];
  let rows=TBL.rows;
  if(TBL.item) rows=rows.filter(function(r){return r.item.indexOf(TBL.item)>=0;});
  const k=TBL.sort;
  return rows.slice().sort(function(a,b){
    let va=a[k], vb=b[k];
    if(va==null) va=-Infinity; if(vb==null) vb=-Infinity;
    if(va<vb) return TBL.desc?1:-1;
    if(va>vb) return TBL.desc?-1:1;
    return a.item<b.item?-1:1;
  });
}

function sortBy(k){ if(TBL.sort===k) TBL.desc=!TBL.desc; else {TBL.sort=k;TBL.desc=true;} renderTable(); }
function filterItem(v){ TBL.item=v.trim(); renderTable(); }

function exportCSV(scope){
  const rows=scope==='view'?tableRows():TBL.rows;

/* ============================================================ ANALYSIS
   Statistics and year-on-year views. Each earns its place by answering a
   question you would otherwise have to eyeball off a chart.               */

function linreg(xs,ys){
  const n=xs.length; if(n<3) return null;
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
  if(!sxx) return null;
  const slope=sxy/sxx;
  return {slope:slope, intercept:my-slope*mx,
          r:(sxx&&syy)?sxy/Math.sqrt(sxx*syy):0};
}
function corr(xs,ys){ const l=linreg(xs,ys); return l?l.r:null; }

function yearColour(y,years){
  const i=years.indexOf(y), n=Math.max(1,years.length-1);
  const h=200-140*(i/n);                 // blue for old, amber for recent
  return `hsl(${h},70%,${45+18*(i/n)}%)`;
}
function statGrid(items){
  return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--bdr);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden">'+
    items.map(function(it){
      return '<div style="background:var(--sur2);padding:8px 9px">'+
        '<div style="font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3)">'+it[0]+'</div>'+
        '<div style="font-size:15px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;color:'+(it[2]||'var(--tx)')+'">'+it[1]+'</div>'+
        (it[3]?'<div style="font-size:9px;color:var(--tx3);margin-top:1px">'+it[3]+'</div>':'')+
      '</div>';
    }).join('')+'</div>';
}

/* ---- price: weekly rows regrouped into calendar years ---- */
function byYear(weekly){
  const out={};
  const bi=BASES[priceBasis].i;
  weekly.forEach(function(w){
    const s=weekStart(w[0]), Y=s.getUTCFullYear();
    const woy=Math.min(52,Math.floor((s.getTime()-Date.UTC(Y,0,1))/WEEK));
    (out[Y]=out[Y]||[]).push({woy:woy,v:w[bi],q:w[4],n:w[5],key:w[0]});
  });
  Object.keys(out).forEach(function(y){ out[y].sort(function(a,b){return a.woy-b.woy;}); });
  return out;
}

function priceStats(){
  const wk=PSER.weekly, ys=byYear(wk);
  const years=Object.keys(ys).map(Number).sort();
  const bi=BASES[priceBasis].i;
  const vals=wk.map(function(w){return w[bi];}).filter(function(v){return v!=null;});
  const med=median(vals), p25=quantile(vals,.25), p75=quantile(vals,.75);

  // typical week-to-week move, as a share of level. Uses the median so one
  // surviving typo does not set the number.
  const moves=[];
  for(let i=1;i<wk.length;i++){
    if(wk[i][0]-wk[i-1][0]!==1) continue;
    if(!wk[i-1][bi]) continue;
    moves.push(Math.abs(wk[i][bi]-wk[i-1][bi])/wk[i-1][bi]);
  }
  const vol=median(moves);

  // seasonal amplitude from the pooled profile
  const s=PSER.seasonal||[];
  let peak=null,trough=null;
  s.forEach(function(r){
    if(!peak||r[3]>peak[3]) peak=r;
    if(!trough||r[3]<trough[3]) trough=r;
  });

  // trend on annual medians
  const annual=years.map(function(y){
    return {y:y, m:median(ys[y].map(function(o){return o.v;})),
            q:ys[y].reduce(function(a,o){return a+(o.q||0);},0)};
  }).filter(function(a){return ys[a.y].length>=30;});
  const tr=linreg(annual.map(function(a){return a.y;}),
                  annual.map(function(a){return a.m;}));
  const trendPct=(tr&&med)?100*tr.slope/med:null;

  // does volume actually move price? on the seasonal profile, logs.
  const pv=s.filter(function(r){return r[3]>0&&r[6]>0;});
  const rho=pv.length>8?corr(pv.map(function(r){return Math.log(r[6]);}),
                             pv.map(function(r){return Math.log(r[3]);})):null;

  // latest week against its own historical norm
  const last=wk[wk.length-1];
  const lastD=weekStart(last[0]);
  const lastWoy=Math.min(52,Math.floor((lastD.getTime()-Date.UTC(lastD.getUTCFullYear(),0,1))/WEEK));
  const nb=SEAS_BASIS[priceBasis];
  const norm=s.filter(function(r){return r[0]===lastWoy;})[0];
  const vsNorm=(norm&&norm[nb])?100*(last[bi]-norm[nb])/norm[nb]:null;

  const U=priceUnit();
  return {years:years, annual:annual, html:
   statGrid([
    [basisLabel()+' price, median', fmt(med)+' <span class="u">'+U+'</span>', null,
     'middle half '+fmt(p25)+'\u2013'+fmt(p75)],
    ['Typical weekly move', vol!=null?(100*vol).toFixed(1)+'%':'\u2014', null,
     'median absolute change'],
    ['Season swing', (peak&&trough&&trough[3])?(peak[3]/trough[3]).toFixed(1)+'\u00d7':'\u2014',
     null, peak?'peak wk '+(peak[0]+1)+', low wk '+(trough[0]+1):''],
    ['Trend', trendPct!=null?(trendPct>0?'+':'')+trendPct.toFixed(1)+'%/yr':'\u2014',
     trendPct==null?null:(trendPct>0?'var(--warn)':'var(--info)'),
     'nominal, not inflation adjusted'],
    ['Price vs arrivals', rho!=null?rho.toFixed(2):'\u2014',
     rho!=null&&rho<-0.4?'var(--ok)':null,
     rho==null?'':(rho<-0.4?'more supply, lower price':
                   rho>0.4?'moves together, so season drives both':'weak link')],
    ['Latest vs its norm', vsNorm!=null?(vsNorm>0?'+':'')+vsNorm.toFixed(0)+'%':'\u2014',
     vsNorm==null?null:(vsNorm>0?'var(--ok)':'var(--err)'),
     'wk from '+isoDay(lastD)+' vs 11 years'],
   ])};
}

/* ============================================================ WEATHER ANALYSIS */
function seasonSeries(){
  /* Cumulative rainfall through the hydrological year, one line per season.
     This is the view that answers "how is this season tracking", which no
     single-number annual total can. */
  const bySeason={};
  WX.daily.forEach(function(r){
    if(!r[5]) return;
    const dt=new Date(r[0]*DAY), Y=dt.getUTCFullYear(), M=dt.getUTCMonth()+1;
    const s=M>=10?Y:Y-1;
    const start=Date.UTC(s,9,1);
    const day=Math.floor((r[0]*DAY-start)/DAY);
    if(day<0||day>365) return;
    (bySeason[s]=bySeason[s]||[]).push([day,r[3]]);
  });
  const seasons=Object.keys(bySeason).map(Number).sort();
  const good=seasons.filter(function(s){return bySeason[s].length>=340;});
  if(good.length<3) return '<div class="why">Not enough complete seasons.</div>';
  const cum={};
  let yh=0;
  good.forEach(function(s){
    bySeason[s].sort(function(a,b){return a[0]-b[0];});
    let t=0; cum[s]=bySeason[s].map(function(p){ t+=p[1]; return [p[0],t]; });
    if(t>yh) yh=t;
  });
  yh*=1.06;
  const x=scale(0,365,PAD.l,W-PAD.r), y=scale(0,yh,H-PAD.b,PAD.t);
  const newest=good[good.length-1];
  const paths=good.map(function(s){
    /* Weekly points only. Daily gave ~10,000 path commands across 29
       seasons, which is a third of a megabyte of SVG on a phone. Cumulative
       rain is monotonic and smooth, so weekly loses nothing visible. */
    const d=cum[s].filter(function(_,i){return i%7===0||i===cum[s].length-1;})
      .map(function(p,i){return (i?'L':'M')+x(p[0])+','+y(p[1]);}).join('');
    const cur=s===newest;
    return '<path d="'+d+'" fill="none" stroke="'+yearColour(s,good)+
      '" stroke-width="'+(cur?2.4:1)+'" opacity="'+(cur?1:.5)+'"/>';
  }).join('');
  const lbl=['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
  const xt=lbl.map(function(l,i){return {v:i*30.4+14,l:l};});
  const pts=[];
  for(let day=0;day<=365;day+=7){
    const all={};
    good.forEach(function(s){
      const hit=cum[s].filter(function(p){return p[0]===day;})[0];
      if(hit) all[s]=hit[1];
    });
    if(Object.keys(all).length) pts.push({k:day,v:all[newest]!=null?all[newest]:null,all:all});
  }
  return svg(axes(x,y,0,yh,xt)+paths,
    {pts:pts,x:x,y:y,label:function(p){
      const vals=Object.keys(p.all).map(function(s){return p.all[s];}).sort(function(a,b){return a-b;});
      const m=median(vals);
      const day0=new Date(Date.UTC(2001,9,1+p.k));
      return '<b>'+day0.getUTCDate()+' '+MONTH[day0.getUTCMonth()]+'</b><br>'+
        'median to date '+fmt(m)+' mm<br>'+
        'driest '+fmt(vals[0])+' \u00b7 wettest '+fmt(vals[vals.length-1])+' mm<br>'+
        '<span style="color:var(--tx3)">'+vals.length+' seasons</span>';
    }})+
    '<div class="legend">'+good.slice(-6).map(function(s){
      return '<span><i style="background:'+yearColour(s,good)+'"></i>'+s+'/'+String(s+1).slice(2)+'</span>';
    }).join('')+'<span style="color:var(--tx3)">older seasons in blue</span></div>';
}

function frostStats(){
  const byY={};
  WX.daily.forEach(function(r){
    if(!r[5]) return;
    const dt=new Date(r[0]*DAY), Y=dt.getUTCFullYear();
    if(WX.complete_years.indexOf(Y)<0) return;
    const doy=Math.floor((r[0]*DAY-Date.UTC(Y,0,1))/DAY)+1;
    const b=(byY[Y]=byY[Y]||{spring:null,autumn:null,frost:0,rain:0,et0:0,tmax:[]});
    b.rain+=r[3]; b.et0+=r[4]; b.tmax.push(r[1]);
    if(r[2]<=0){
      b.frost++;
      if(doy<=182) b.spring=Math.max(b.spring||0,doy);
      else b.autumn=Math.min(b.autumn||400,doy);
    }
  });
  const yrs=Object.keys(byY).map(Number).sort();
  const spring=yrs.map(function(y){return byY[y].spring;}).filter(function(v){return v;});
  const autumn=yrs.map(function(y){return byY[y].autumn;}).filter(function(v){return v;});
  const rain=yrs.map(function(y){return byY[y].rain;});
  const et0=yrs.map(function(y){return byY[y].et0;});
  const frost=yrs.map(function(y){return byY[y].frost;});
  const label=function(doy){
    if(doy==null) return '\u2014';
    const d=new Date(Date.UTC(2001,0,Math.round(doy)));
    return d.getUTCDate()+' '+MONTH[d.getUTCMonth()];
  };
  const tRain=linreg(yrs,rain);
  const free=yrs.map(function(y){
    const b=byY[y]; return (b.spring&&b.autumn)?b.autumn-b.spring:null;
  }).filter(function(v){return v;});
  return statGrid([
    ['Last spring frost', label(median(spring)), null,
     '9 yrs in 10 by '+label(quantile(spring,.9))],
    ['First autumn frost', label(median(autumn)), null,
     'in '+autumn.length+' of '+yrs.length+' years'],
    ['Frost-free season', free.length?fmt(median(free))+' <span class="u">days</span>':'\u2014',
     null, free.length?fmt(Math.min.apply(null,free))+'\u2013'+fmt(Math.max.apply(null,free)):''],
    ['Frost nights', fmt(median(frost),1)+' <span class="u">/yr</span>', null,
     'reanalysis average, a floor'],
    ['Annual rain', fmt(median(rain))+' <span class="u">mm</span>', null,
     fmt(Math.min.apply(null,rain))+'\u2013'+fmt(Math.max.apply(null,rain))+' mm'],
    ['Rain trend', tRain?(tRain.slope>0?'+':'')+fmt(tRain.slope*10)+' <span class="u">mm/decade</span>':'\u2014',
     tRain&&tRain.slope<0?'var(--warn)':null,
     tRain?'r = '+tRain.r.toFixed(2)+', weak either way':''],
    ['Annual ET0', fmt(median(et0))+' <span class="u">mm</span>', null,
     'reference demand'],
    ['Shortfall', fmt(median(et0)-median(rain))+' <span class="u">mm</span>','var(--warn)',
     'per dunum, that is m\u00b3 to pump'],
  ]);
}

/* ============================================================ ECONOMICS
   Nothing here is sourced. Every figure is yours, entered once and saved with
   the plots. Blank stays blank: a missing input produces "cannot compute",
   never a filled-in guess, because these numbers multiply straight through to
   the answer.

   Bulletin prices are wholesale at the Amman central market, in fils per kg.
   1000 fils = 1 JD. What reaches you is less, and how much less depends on
   which channel the produce goes through.                                  */

let settings = {
  /* The bulletin prints a bare number. Whether it is piastres (1/100 JD) or
     fils (1/1000 JD) changes every result by a factor of ten, and the
     bulletin does not say. Potato at 35 and cherry tomato at 150 read as
     0.35 and 1.50 JD/kg under piastres, which is plausible, and as 0.035 and
     0.15 under fils, which is not. Piastres is the default on that reasoning
     alone. CONFIRM IT AGAINST A PRICE YOU KNOW before trusting any figure
     downstream. */
  unitsPerJD:100,
  dayRate:null, waterCost:null, irrigEff:null,
  gateCommissionPct:null,
  marketFactor:1.0, marketKgPerDay:null, marketDaysPerWeek:null,
  tripCost:null, stallFee:null,
  crateCost:null, crateKg:null, crateUses:1,
  priceMap:{},
};

  ['inputsPerDunum','Fertiliser and chemicals, per dunum','JD'],

  ['irrigEff','Irrigation efficiency, 0 to 1',''],
  ['gateCommissionPct','Farm gate: trader&rsquo;s cut','%'],

const SEASONAL={};
async function seasonalFor(seriesId){
  if(SEASONAL[seriesId]) return SEASONAL[seriesId];
  try{ const d=await getJSON('data/prices/'+seriesId+'.json');
       SEASONAL[seriesId]=d.seasonal; return d.seasonal; }
  catch(e){ return null; }
}

/* Harvest runs over the late stage, not a single day. */
function harvestWeeks(crop){
  const L=crop.stages, total=L[0]+L[1]+L[2]+L[3], late=L[3];
  const doy0=Math.floor((Date.UTC(2001,crop.plant[0]-1,crop.plant[1])
              -Date.UTC(2001,0,1))/DAY)+total-late;
  const weeks=[];
  for(let d=doy0; d<doy0+late; d+=7) weeks.push(Math.min(52,Math.floor((d%365)/7)));
  return {weeks:[...new Set(weeks)], total, late,
          harvestFrom:doy0, harvestTo:doy0+late};
}

function priceBand(seasonal, weeks){
  if(!seasonal) return null;
  const rows=seasonal.filter(r=>weeks.indexOf(r[0])>=0);
  if(!rows.length) return null;
  const pick=i=>median(rows.map(r=>r[i]).filter(v=>v!=null));
  return {p10:pick(1),p25:pick(2),p50:pick(3),p75:pick(4),p90:pick(5),
          qty:median(rows.map(r=>r[6]).filter(v=>v!=null)), n:rows.length};
}

function economics(z, crop, filsPerKg, lay, dunum){
  const S=settings, missing=[];
  const yieldKg = (z.yieldPerDunum!=null?z.yieldPerDunum
    :(YIELDS&&YIELDS.crops&&YIELDS.crops[crop.id]?YIELDS.crops[crop.id].kg_per_dunum:null));
  if(yieldKg==null) missing.push('yield');
  if(S.dayRate==null) missing.push('day rate');
  if(S.gateCommissionPct==null) missing.push('trader\u2019s cut');
  if(missing.length) return {missing:missing};

  const c=z.costs||{};
  const total=yieldKg*dunum;
  const hw=harvestWeeks(crop);
  const weeksOut=Math.max(1,Math.ceil(hw.late/7));

  /* The local market has a hard ceiling. Whatever the harvest window makes
     beyond what you can physically sell goes to the gate at the lower price,
     whether you like it or not. Selling the whole crop at the better price
     would be flattering nonsense. */
  const cap=(S.marketKgPerDay&&S.marketDaysPerWeek)
    ? S.marketKgPerDay*S.marketDaysPerWeek*weeksOut : 0;
  const viaMarket=Math.min(total,cap), viaGate=total-viaMarket;
  const marketDays=S.marketKgPerDay?Math.ceil(viaMarket/S.marketKgPerDay):0;

  const jd=filsPerKg/(settings.unitsPerJD||100);
  const gatePrice=jd*(1-S.gateCommissionPct/100);
  const marketPrice=jd*(S.marketFactor||1);
  const cratePerKg=(S.crateCost&&S.crateKg)
    ? S.crateCost/S.crateKg/Math.max(1,S.crateUses||1) : 0;

  const revenue = viaGate*gatePrice + viaMarket*marketPrice
                - viaMarket*cratePerKg
                - marketDays*((S.tripCost||0)+(S.stallFee||0));

  const w=waterMin(crop);
  const grossW = w ? w.mm/(S.irrigEff||1) : null;
  const costs={
    seed:(c.seedPerPlant||0)*lay.plants,
    prep:(c.prepPerDunum||0)*dunum,
    inputs:(c.inputsPerDunum||0)*dunum,
    drip:(c.dripPerMetre||0)*lay.rowMetres,
    planting:(c.plantingDays||0)*dunum*S.dayRate,
    weeding:(c.weedingDays||0)*dunum*S.dayRate,
    picking:(c.pickDaysPerTonne||0)*(total/1000)*S.dayRate,
    water:(grossW!=null&&S.waterCost!=null)?grossW*dunum*S.waterCost:0,
  };
  let cost=0; for(const k in costs) cost+=costs[k];
  const m3=grossW!=null?grossW*dunum:null;
  return {revenue:revenue,cost:cost,margin:revenue-cost,costs:costs,total:total,
          viaGate:viaGate,viaMarket:viaMarket,marketDays:marketDays,cap:cap,
          m3:m3,perM3:m3?(revenue-cost)/m3:null};
}

/* ============================================================ MONEY TAB */
async function renderMoney(){
  const el=document.getElementById('moneyBody');
  const z=zones.find(x=>x.id===selId)||zones[0];
  if(!PIDX){ try{ PIDX=await getJSON('data/prices_index.json'); }catch(e){} }
  if(PIDX) CROPS.forEach(function(c){
    const vs=varietiesOf(c.id);
    if(!vs.length) return;
    // default to the most-traded variety; the switcher below overrides it
    if(!settings.priceMap[c.id] || !vs.some(function(s){return s.id===settings.priceMap[c.id];}))
      settings.priceMap[c.id]=vs[0].id;
  });

  const dunum=z?areaM2(z.poly)/1000:1;
  const lay=z?layout(z):{plants:0,rowMetres:0};
  const base=z||{costs:{}};

  const ranked=[];
  for(let i=0;i<CROPS.length;i++){
    const c=CROPS[i]; if(c.gap) continue;
    const sid=settings.priceMap[c.id];
    const seasonal=sid?await seasonalFor(sid):null;
    const hw=harvestWeeks(c);
    const band=priceBand(seasonal,hw.weeks);
    let econ=null;
    if(band){
      const mid=economics(base,c,band.p50,lay,dunum);
      econ=mid.missing?mid:{mid:mid,
        lo:economics(base,c,band.p10,lay,dunum),
        hi:economics(base,c,band.p90,lay,dunum)};
    }
    ranked.push({crop:c,sid:sid,band:band,hw:hw,econ:econ});
  }
  ranked.sort((a,b)=>{
    const va=(a.econ&&!a.econ.missing&&a.econ.mid.perM3!=null)?a.econ.mid.perM3:-1e9;
    const vb=(b.econ&&!b.econ.missing&&b.econ.mid.perM3!=null)?b.econ.mid.perM3:-1e9;
    return vb-va;
  });

  const gaps=[];
  ranked.forEach(r=>{ if(r.econ&&r.econ.missing)
    r.econ.missing.forEach(m=>{ if(gaps.indexOf(m)<0) gaps.push(m); }); });

  el.innerHTML=
   '<div class="card"><h3>Selling</h3>'+
   '<div class="row"><label>Bulletin price unit</label>'+
   '<select style="width:150px" onchange="setSetting(\'unitsPerJD\',+this.value)">'+
   '<option value="100"'+(settings.unitsPerJD==100?' selected':'')+'>piastres (1/100 JD)</option>'+
   '<option value="1000"'+(settings.unitsPerJD==1000?' selected':'')+'>fils (1/1000 JD)</option>'+
   '</select></div>'+
   '<div class="gap">A median '+(PIDX?'listed price':'price')+' reads very '+
   'differently under the two. Check one crop you know: at piastres, potato '+
   'at 35 is 0.35 JD/kg. If that is wrong, switch to fils and every number '+
   'on this page moves by ten.</div>'+
   '<div class="why">Bulletin prices are '+
   'wholesale in Amman. What reaches you depends on the channel. The local '+
   'market pays better but has a ceiling: whatever the harvest makes beyond '+
   'what you can physically sell goes to the gate at the trader&rsquo;s price. '+
   'Nothing here has a default. Fill what you know, leave the rest blank.</div>'+
   SETTINGS_FIELDS.map(f=>field(settings,f[0],f[1],f[2],'setSetting')).join('')+
   '</div>'+

   (z?'<div class="card"><h3>Costs for '+z.label+'</h3><div class="why">Per '+
     'plot, since two dunum of okra and fifteen of garlic are not the same '+
     'job. Drip tape uses the row length the geometry already gave: '+
     fmt(lay.rowMetres)+' m.</div>'+
     PLOT_COSTS.map(f=>field(z.costs||{},f[0],f[1],f[2],'setCost')).join('')+
     '</div>'
    :'<div class="card"><div class="why">Draw a plot on the Plan tab to enter '+
     'costs and rank crops against it.</div></div>')+

   varietyCard()+
   '<div class="card"><h3>Crop ranking</h3><div class="why">Margin per cubic '+
   'metre of water, because the well is the binding constraint, not the land. '+
   'Price is what the harvest weeks have actually paid across eleven years, so '+
   'the range is evidence rather than a confidence interval.'+
   (z?' Against '+z.label+', '+fmt(dunum,2)+' dunum.':'')+'</div>'+
   (gaps.length?'<div class="gap"><b>Cannot compute yet.</b> Missing: '+
     gaps.join(', ')+'.</div>':'')+
   rankTable(ranked)+'</div>';
}

function rankTable(ranked){
  const ok=ranked.filter(r=>r.econ&&!r.econ.missing);
  if(!ok.length){
    const noPrice=ranked.filter(r=>!r.band).map(r=>r.crop.en);
    return '<div class="why">Nothing to rank yet.'+
      (noPrice.length?' No price series linked for: '+noPrice.join(', ')+
       '. Fill crop_id in item_mapping.csv and re-run aggregate.py.':'')+'</div>';
  }
  return '<div class="out" style="padding:0">'+ok.map(function(r){
    const e=r.econ,m=e.mid;
    const d0=new Date(Date.UTC(2001,0,1+r.hw.harvestFrom));
    const d1=new Date(Date.UTC(2001,0,1+r.hw.harvestTo));
    const pos=m.perM3>0;
    return '<div style="padding:9px 10px;border-bottom:1px solid rgba(48,54,61,.6)">'+
     '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'+
      '<div><b style="font-size:13px">'+r.crop.en+'</b><span class="u"> \u00b7 '+r.crop.ar+'</span></div>'+
      '<div class="v" style="font-size:15px;color:'+(pos?'var(--ok)':'var(--err)')+'">'+
       fmt(m.perM3,2)+' <span class="u">JD/m\u00b3</span></div></div>'+
     '<div style="font-size:10px;color:var(--tx3);margin-top:3px;line-height:1.6">'+
      'plant '+MONTH[r.crop.plant[0]-1]+' '+r.crop.plant[1]+' \u00b7 harvest '+
      d0.getUTCDate()+' '+MONTH[d0.getUTCMonth()]+'\u2013'+d1.getUTCDate()+' '+
      MONTH[d1.getUTCMonth()]+' \u00b7 '+r.hw.total+' days<br>'+
      'price '+fmt(r.band.p10)+'\u2013'+fmt(r.band.p90)+' fils/kg (median '+fmt(r.band.p50)+')<br>'+
      'margin '+fmt(e.lo.margin)+' to '+fmt(e.hi.margin)+' JD, median '+fmt(m.margin)+
      ' \u00b7 water '+fmt(m.m3)+' m\u00b3<br>'+
      (m.cap>0?fmt(m.viaMarket)+' kg to market over '+m.marketDays+' days, '+
        fmt(m.viaGate)+' kg to the gate'
       :'all '+fmt(m.total)+' kg to the gate')+
     '</div></div>';
  }).join('')+'</div>'+
  '<div class="note">Water is ETc divided by your efficiency figure. ETc is a '+
  'floor, so with efficiency blank the water cost is understated and every '+
  'crop looks better than it is.</div>';
}


upDo(); render();
</script>

</html>
