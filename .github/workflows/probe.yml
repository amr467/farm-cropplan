
name: Connectivity probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: Can the runner reach the bulletin?
        run: |
          python - <<'EOF'
          import sys, requests
          from bs4 import BeautifulSoup

          URL = "https://www.ammancity.gov.jo/ar/market/prices.aspx"
          H = {"User-Agent": ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) "
                              "Chrome/126.0.0.0 Safari/537.36"),
               "Accept-Language": "ar,en-US;q=0.9,en;q=0.8"}
          try:
              r = requests.get(URL, headers=H, timeout=60)
          except Exception as e:
              sys.exit(f"BLOCKED or unreachable: {type(e).__name__}: {e}")

          print(f"HTTP {r.status_code}, {len(r.content)} bytes")
          if r.status_code != 200:
              sys.exit("Non-200. The runner is probably blocked.")

          soup = BeautifulSoup(r.text, "html.parser")
          vs = soup.find("input", {"name": "__VIEWSTATE"})
          table = soup.find("table", class_="table-bordered")
          print(f"__VIEWSTATE present: {vs is not None}")
          print(f"price table present: {table is not None}")
          if vs is None:
              sys.exit("No viewstate. Either blocked by an interstitial, or "
                       "the page has been rebuilt and the scraper needs work.")
          print("\nReachable. The daily workflow should work from Actions.")
          EOF

      - name: Can it reach Open-Meteo?
        run: |
          python - <<'EOF'
          import requests
          r = requests.get("https://archive-api.open-meteo.com/v1/archive",
                           params={"latitude":32.5,"longitude":36.2,
                                   "start_date":"2024-01-01","end_date":"2024-01-02",
                                   "daily":"temperature_2m_max","timezone":"Asia/Amman"},
                           timeout=60)
          r.raise_for_status()
          print("Open-Meteo OK:", r.json().get("daily", {}))
          EOF
