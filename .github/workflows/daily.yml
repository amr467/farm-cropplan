
name: Daily update

on:
  schedule:
    # 04:30 UTC = 07:30 Amman. After the bulletin is up, before you look at it.
    # Cron on GitHub is best-effort and often runs late under load; the script
    # looks back three weeks so a skipped run costs nothing.
    - cron: "30 4 * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    paths:
      - "index.html"          # rebuild the site when the app changes
      - "scripts/**"
      - "data/item_mapping.csv"

permissions:
  contents: write             # to commit new observations
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false   # never interrupt a run mid-scrape

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Scraping is skipped on a push-triggered run: a code change is no
      # reason to hit the municipality's server again.
      - name: Fetch new bulletin days
        if: github.event_name != 'push'
        run: python scripts/daily_update.py --lookback 21
        continue-on-error: true      # a bad day should still deploy the site

      - name: Commit new observations
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/observations; then
            echo "No new observations."
          else
            git add data/observations
            git commit -m "Observations: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build site
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # If the scrape fails repeatedly the site quietly goes stale, which is the
  # failure mode that matters. This opens an issue so you find out.
  alert:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily update failed";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: ["automation"]
            });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ["automation"],
              body: [
                `The daily job failed on ${new Date().toISOString().slice(0,10)}.`,
                ``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Most likely causes, in order:`,
                `- the municipality site blocked the runner's IP`,
                `- the page layout changed and the parser no longer matches`,
                `- Open-Meteo was unavailable`,
                ``,
                `The site stays up on the last good build. The app shows a`,
                `staleness banner once the data is more than three days old.`
              ].join("\n")
            });
